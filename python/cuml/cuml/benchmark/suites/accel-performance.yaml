# Representative cuml.accel performance workloads across 168 cases.
# See accel-performance.md for provenance and methodology.
# Uses the existing dataset generators with rounded workload sizes.

version: 2
name: accel-performance
implementations:
- scikit-learn
- cuml.accel
profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0

cases:
  - label: dbscan.fit_predict.large.balanced
    estimator: DBSCAN
    dataset:
      kind: blobs
      shape:
        rows: 32000
        features: 32
      parameters:
        centers: 8
      dtype: float32
    operation: fit_predict
    input_selection:
    - X
    parameters:
      eps: 3.0
      min_samples: 5
      n_jobs: -1
    timeout_sec: 850

  - label: dbscan.fit_predict.medium.balanced
    estimator: DBSCAN
